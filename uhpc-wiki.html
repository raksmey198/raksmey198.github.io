t depth: abstract and introduction only.", "highlights": ["Thermal curing at 90 °C gave the best mechanical properties.", "90 °C thermal curing outperformed water curing.", "3 vol% steel fibre gave the best tensile strength; up to 2 vol% is enough to trigger strain hardening; 0.5 vol% polyethylene + 2.0 vol% steel fibre gave notable flexural ", "W/C < 0.20 gave the best mechanics but needs good curing to avoid autogenous shrinkage."], "disagree": false}, {"id": "el-abbasy-2023-uhpfrc-tensile-flexural-review", "title": "El-Abbasy 2023 — Tensile, flexural, impact and fracture properties of UHPFRC", "path": "wiki/sources/el-abbasy-2023-uhpfrc-tensile-flexural-review.md", "type": "source", "theme": "materials", "year": 2023, "depth": "abstract", "summary": "Construction and Building Materials 408, 133621. Ingest depth: abstract only.", "highlights": ["Adding 2 vol% steel fibre raised splitting tensile strength by up to 228% and flexural strength by up to 180%.", "Longer fibres (30 mm medium hook-ended, 60 mm 5D) further improve load capacity and strain hardening.", "Fracture energy above 2000 N/m with steel fibres.", "Excellent impact energy absorption, better than normal concrete."], "disagree": false}, {"id": "he-2026-bridge-rehabilitation-review", "title": "He et al. 2026 — UHPC bridge rehabilitation review", "path": "wiki/sources/he-2026-bridge-rehabilitation-review.md", "type": "source", "theme": "structural", "year": 2026, "depth": "deep", "summary": "Review article (Structure and Infrastructure Engineering, DOI 10.1080/15732479.2026.2736724) by S. He, Y. Zheng, S. Hu, B. Lin, H. Deng (Guangdong University of Technology). Synthesises UHPC material properties, the UHPC–normal concrete (NC) bond, behaviour of UHPC-strengthened members, durability, ", "highlights": ["UHPC typical properties: compressive 120–200 MPa, tensile 7–11 MPa, flexural 20–25 MPa, elastic modulus >40 GPa. See uhpc-mix-design.", "Fatigue: UHPC–RC composite beams keep a fatigue limit of ~50% of s le": "Li et al. 2025 — Durability of UHPC in aggressive environments", "path": "wiki/sources/li-2025-uhpc-aggressive-environments-review.md", "type": "source", "theme": "durability", "year": 2025, "depth": "sections", "summary": "Journal of Building Engineering 115, 114486 (Chongqing Jiaotong University). Ingest depth: abstract only.", "highlights": ["Chloride diffusion coefficient <10⁻¹² m²/s; <10% dynamic-modulus loss after 1000 freeze-thaw cycles; prone to elevated-temperature spalling.", "Crack width >0.1 mm sharply weakens mechanical properties and impermeability.", "Enhancement: mineral admixtures, nanomaterials, W/B 0.15–0.25, steam curing 60–90 °C (porosity <5%); synthetic fibres or nano-SiO2 coating raised bond strength by 50%.", "NC chloride coefficient generally >10⁻¹¹ m²/s vs UHPC <10⁻¹² m²/s; freeze-thaw mass loss <1% after 1000 cycles; no carbonation after prolonged exposure."], "disagree": false}, {"id": "mandor-2026-uhpc-roadmap", "title": "Mandor & Taie 2026 — Critical review and roadmap for UHPC design, performance and standards", "path": "wiki/sources/mandor-2026-uhpc-roadmap.md", "type": "source", "theme": "sustain", "year": 2026, "depth": "conclusions", "summary": "Discover Concrete and Cement 2:11 (Norda Stelo, Canada). Ingest depth: abstract only.", "highlights": ["Commercial proprietary UHPC has sold at about USD 2,000/yd³ (~2,600/m³) vs ~100/yd³ (~130/m³) for conventional concrete: about 20 times; non-proprietary open-recipe UHPC ", "Market: global UHPC about USD 892 million (2016), forecast 8.6% growth to about 1.87 billion by 2025–26 (market-research figures, not peer-reviewed).", "Life-cycle cost can be lower than normal concrete in infrastructure thanks to fewer repairs and longer intervals.", "Conclusion priorities: large-scale field trials; low-carbon UHPC (SCMs, recycled aggregates, alternative binders); hybrid reinforcement (steel, synthetic, smart fibres) f"], "disagree": false}, {"id": "mo-2020-early-curing-late-age-hydration", "title": "Mo, Zhou & Bai 2020 — Early-age curing regimes and late-age hydration of UHPC", "path": "wiki/sources/mo-2020-early-curing-late-age-hydration.md", "type": "source", "theme": "early", "year": 2020, "depth": "ris", "summary": "Advances in Civil Engineering Materials, DOI 10.1520/ACEM20200037. Ingest depth: RIS abstract only.", "highlights": ["Compressive strength tends to rise from 28 to 42 days, then fall.", "MK reduces the late-age strength decline of steam-cured UHPC.", "Ternary MK+LS blends show similar strength development and microstructure to binary MK pastes."], "disagree": false}, {"id": "park-2015-early-age-strength-curing-conditions", "title": "Park et al. 2015 — Early-age strength of UHPC in various curing conditions", "path": "wiki/sources/park-2015-early-age-strength-curing-conditions.md", "type": "source", "theme": "early", "year": 2015, "depth": "ris", "summary": "Materials 8, DOI 10.3390/ma8085261. Ingest depth: RIS abstract only.", "highlights": [], "disagree": false}, {"id": "shi-2015-uhpc-review-part1", "title": "Shi et al. 2015 — UHPC review, Part I: raw materials and mixture design", "path": "wiki/sources/shi-2015-uhpc-review-part1.md", "type": "source", "theme": "materials", "year": 2015, "depth": "conclusions", "summary": "Construction and Building Materials 101, 741–751 (Hunan University). Ingest depth: abstract, highlights and conclusions only. Check the PDF before quoting numbers.", "highlights": ["With a proper amount of SCMs (fly ash, slag), UHPC reached 150–200 MPa after normal curing.", "Four design principles: reduce porosity, improve microstructure, enhance homogeneity, increase toughness.", "Fly ash and slag can partly or fully replace cement and silica fume, cutting cost without losing strength.", "High-temperature curing gives a denser microstructure than room-temperature curing but limits applications. The trend is UHPC from widely available materials, ordinary ca"], "disagree": false}, {"id": "sun-2026-early-age-uhpc-elevated-temperature", "title": "Sun et al. 2026 — Early-age UHPC exposed to elevated temperature", "path": "wiki/sources/sun-2026-early-age-uhpc-elevated-temperature.md", "type": "source", "theme": "durability", "year": 2026, "depth": "ris", "summary": "Construction and Building Materials, DOI 10.1016/j.conbuildmat.2026.147487. Ingest depth: RIS abstract only.", "highlights": ["Failure is splitting or shear below 600 °C and ductile collapse at 800 °C.", "Compressive strength first rises then falls with temperature, peaking near 400 °C; younger specimens gain more (up to 80–100%).", "Elastic modulus can drop by more than 90% and peak strain rise by more than 800% as temperature increases.", "Authors propose empirical formulas and a stress-strain model."], "disagree": false}, {"id": "takigawa-2025-precast-early-strength-formula", "title": "Takigawa et al. 2025 — Early-age strength estimation for steam-cured precast concrete", "path": "wiki/sources/takigawa-2025-precast-early-strength-formula.md", "type": "source", "theme": "early", "year": 2025, "depth": "ris", "summary": "Proceedings of ICBMC 2025, DOI 10.1007/978-981-96-7687-3_8. Ingest depth: RIS abstract only. Not UHPC-specific: it concerns precast concrete generally.", "highlights": [], "disagree": false}, {"id": "uhpc-bridge-applications", "title": "UHPC in bridge rehabilitation: applications", "path": "wiki/concepts/uhpc-bridge-applications.md", "type": "concept", "theme": "structural", "year": null, "depth": null, "summary": "UHPC suits space-constrained repairs because thin sections match or beat HPC or polymer-modified mortar. First UHPC highway bridge: France, 2001. Switzerland: >280 applications by 2021.", "highlights": ["Deck replacement: Hanshin Expressway (Japan) replaced RC decks with UHPC slabs on four bridges by 2024.", "Girders: Montbovon bridge (Switzerland, 2013), 30–60 mm overlay on RC girders; Jupiterstrasse viaduct (Bern).", "Substructures: Mission Bridge (Canada, 2014), 229 mm UHPC layer on piers, displacement ductility up 2–3 times; CN Rail Bridge, 100 mm protective layer; Hagwilget Suspensi", "Also cited: 2004 Swiss rehabilitation, Mafang Bridge (China, 2011)."], "disagree": false}, {"id": "uhpc-design-and-standards", "title": "UHPC design provisions and standards", "path": "wiki/concepts/uhpc-design-and-standards.md", "type": "concept", "theme": "sustain", "year": null, "depth": null, "summary": "Consistent theme across reviews: no globally accepted UHPC definition or design properties. - Definitions differ: ≥150 MPa (shi-2015-uhpc-review-part1), ≥22 ksi ≈ 152 MPa (baqersad-2017-uhpc-mechanical-properties), >120 MPa (zhang-2024-low-carbon-uhpc-review), >100 MPa and >12 MPa flexural in China'", "highlights": ["Definitions differ: ≥150 MPa (shi-2015-uhpc-review-part1), ≥22 ksi ≈ 152 MPa (baqersad-2017-uhpc-mechanical-properties), >120 MPa (zhang-2024-low-carbon-uhpc-review), >10", "Adoption barriers: high initial cost, limited contractor experience, no accepted design provisions (abbas-2016-uhpc-performance-challenges, he-2026-bridge-rehabilitation-", "Reinforced UHPC behaves differently from conventional RC, so RC design rules need modification (hung-2021-ruhpc-structural-review).", "Tensile strength (0.9–1.3 ksi vs 0.3–0.7 ksi for normal concrete) should be counted in design, unlike conventional RC practice (baqersad-2017-uhpc-mechanical-properties)."], "disagree": true}, {"id": "uhpc-durability", "title": "UHPC durability", "path": "wiki/concepts/uhpc-durability.md", "type": "concept", "theme": "durability", "year": null, "depth": null, "summary": "Dense matrix (W/B ≈ 0.2, high fines) gives very low permeability. For repair-specific durability see uhpc-time-dependent-properties and uhpc-nc-interface-bond. Main sources: li-2020-uhpc-durability-review (material level) and li-2025-uhpc-aggressive-environments-review (material, interface, structur", "highlights": ["Cracking is almost inevitable in service (shrinkage, load, temperature). Chloride transport depends on crack width: thresholds reported at roughly 80–100 µm; rebar stays ", "Doubling cover cut rebar mass loss by 42% in one study.", "Bond at a UHPC repair interface fell far less than at a normal-concrete interface under sulfate cycling (27% vs 100% damage after 240 cycles).", "Joints, the UHPC–NC interface and the reinforcement interface are the weak points; rebar corrosion there is highly localised."], "disagree": true}, {"id": "uhpc-early-age-and-curing", "title": "UHPC early-age behaviour and curing", "path": "wiki/concepts/uhpc-early-age-and-curing.md", "type": "concept", "theme": "early", "year": null, "depth": null, "summary": "Early strength is a bottleneck for precast schedules and on-site work. Sources split into heat-based, field-friendly and binder-based routes. Complements the review-level curing summary in uhpc-mix-design.", "highlights": ["Steam curing: 3-day strength 131.6 MPa, +86.4% vs normal curing in a limestone-cement UHPC (wu-2026-hydration-limestone-cement-steam-curing).", "Thermal curing of a non-proprietary mix: +77–90% short term, +10–30% long term (alahmari-2025-non-proprietary-uhpfrc-ml).", "Reviews report autoclave +28% and steam +20% compressive over standard curing (he-2026-bridge-rehabilitation-review); best properties at 90 °C (el-abbasy-2022-uhpfc-produ", "Late-age cost: strength may rise to ~42 days then fall in hot-water exposure; metakaolin lessens this (mo-2020-early-curing-late-age-hydration)."], "disagree": false}, {"id": "uhpc-fibres-and-tensile-behaviour", "title": "Fibres and tensile behaviour of UHPC", "path": "wiki/concepts/uhpc-fibres-and-tensile-behaviour.md", "type": "concept", "theme": "materials", "year": null, "depth": null, "summary": "Steel fibres give UHPC its tensile strength, ductility and crack bridging (see also uhpc-mix-design).", "highlights": ["2 vol% steel fibre: splitting tensile strength up to +228%, flexural strength up to +180% (el-abbasy-2023-uhpfrc-tensile-flexural-review).", "Longer fibres (30 mm hooked, 60 mm 5D) improve load capacity and strain hardening (el-abbasy-2023-uhpfrc-tensile-flexural-review).", "Fracture energy >2000 N/m; strong impact energy absorption.", "Tensile response depends on fibre content, shape, length, hybridisation, matrix, fibre orientation and specimen size (du-2024-steel-fibre-tensile-review)."], "disagree": true}, {"id": "uhpc-mix-design", "title": "UHPC mix design and curing", "path": "wiki/concepts/uhpc-mix-design.md", "type": "concept", "theme": "materials", "year": null, "depth": null, "summary": "UHPC is Portland cement, silica fume, fine quartz sand (no coarse aggregate, for packing density and homogeneity), superplasticizer, a low water-to-binder (W/B) ratio and steel fibres. Typical strengths: 120–200 MPa compressive, 7–11 MPa tensile.", "highlights": ["Higher W/B lowers compressive and flexural strength, with a pronounced drop beyond 0.2; fluidity rises.", "Reported optima differ: strength peaks at 0.18 (Yu 2015) or 0.15 (Zheng & Li 2009); lowest chloride penetration and porosity at 0.18 (Yin 2022). Hu (2018) recommends W/B ", "Review's data: 85.29% of W/B values in tests and projects lie in 0.15–0.23; small specimens mostly <0.18, large-scale applications mostly 0.18–0.23.", "A hybrid of long and short straight fibres at a 1:3 volume ratio (2% total) gave the best combined compressive and flexural strength and toughening."], "disagree": true}, {"id": "uhpc-mixture-design-methods", "title": "UHPC mixture design methods", "path": "wiki/concepts/uhpc-mixture-design-methods.md", "type": "concept", "theme": "materials", "year": null, "depth": null, "summary": "Normal-concrete trial-and-error design does not transfer to UHPC (zhou-2021-uhpc-mixture-design-methods-review). Four method families: 1. Close packing (dry and wet packing density). 2. Rheology-based. 3. Statistical mixture design. 4. Artificial neural network (ANN).", "highlights": [], "disagree": false}, {"id": "uhpc-nc-interface-bond", "title": "UHPC–NC interface bond", "path": "wiki/concepts/uhpc-nc-interface-bond.md", "type": "concept", "theme": "structural", "year": null, "depth": null, "summary": "Bond between UHPC and normal concrete (NC) decides whether a repair works.", "highlights": ["Shear keys / grooves: shear strength second only to sandblasting (13.63 MPa, Tayeh 2013); wider grooves and greater depth increase strength.", "he-2026-bridge-rehabilitation-review (Section 3)", "Roughening (wire brush, sandblasting, shot blasting, water jet): removes the weak layer and exposes aggregate; often shifts failure from the interface into the substrate.", "Rebar implantation: raises shear strength and slip resistance."], "disagree": true}, {"id": "uhpc-strengthened-members", "title": "UHPC-strengthened RC members", "path": "wiki/concepts/uhpc-strengthened-members.md", "type": "concept", "theme": "structural", "year": null, "depth": null, "summary": "Flexural, shear and fatigue behaviour of RC members retrofitted with UHPC, and performance in adverse environments. Main source: he-2026-bridge-rehabilitation-review (Section 4, read in full). Design-level context: hung-2021-ruhpc-structural-review.", "highlights": ["Hybrid UHPC (compression) + FRP (tension) improved both cracking and ultimate resistance (Balla 2025) but shifted failure from flexure to flexure-shear, so ultimate stren", "Pre-damage: effectiveness falls as pre-damage rises (70–90% of ultimate load used in tests; ~0.2 mm pre-cracks are the usual benchmark). Prestressed UHPC overlays beat co", "Thickness and fibre: more fibre pushes failure toward flexure and raises capacity and ductility. ~20 mm layers crack more; ~40 mm layers greatly raise capacity and often ", "Ductility usually falls: B-side strengthened beams develop a single major crack and lower ductility index; more pre-damage lowers it further. A field test peaked in ducti"], "disagree": true}, {"id": "uhpc-sustainability", "title": "UHPC sustainability and cost", "path": "wiki/concepts/uhpc-sustainability.md", "type": "concept", "theme": "sustain", "year": null, "depth": null, "summary": "Tension: UHPC is claimed to be low in embodied carbon per unit of performance, but high cement content and heat curing raise it per cubic metre. The sources frame this differently; compare the system boundary used in each before citing.", "highlights": ["Lower-carbon routes ranked (zhang-2024-low-carbon-uhpc-review): geopolymer UHPC is best on embodied carbon and energy; SCM or recycled-powder cement replacement is effect", "Cement/silica fume replacement by fly ash and slag cuts cost without strength loss (shi-2015-uhpc-review-part1).", "Local materials under normal curing should reduce cost (abbas-2016-uhpc-performance-challenges).", "Multiscale mechanics, additive manufacturing and AI are proposed as future enablers (wang-2024-multiscale-sustainable-fibre-uhpc)."], "disagree": true}, {"id": "uhpc-time-dependent-properties", "title": "UHPC creep, shrinkage and durability", "path": "wiki/concepts/uhpc-time-dependent-properties.md", "type": "concept", "theme": "durability", "year": null, "depth": null, "summary": "Early-age shrinkage detail (yalcinkaya-2017-early-age-shrinkage-mineral-admixtures): 50% GGBFS or 30% fly ash still reaches 150 MPa, but GGBFS markedly increases autogenous and drying shrinkage; superplasticizer type/dose strongly affects autogenous shrinkage (li-2017-pce-superplasticizer-early-age)", "highlights": ["he-2026-bridge-rehabilitation-review (Section 2.3)"], "disagree": false}, {"id": "ullah-2022-uhpc-state-of-the-art", "title": "Ullah et al. 2022 — UHPC: a state-of-the-art review", "path": "wiki/sources/ullah-2022-uhpc-state-of-the-art.md", "type": "source", "theme": "materials", "year": 2022, "depth": "conclusions", "summary": "Materials 15, 4131 (Central South University). Ingest depth: abstract only.", "highlights": ["Best mechanical results at W/B below 0.20; maximum mechanical and durability performance at 2.0 vol% steel fibre, with hooked fibres better still.", "Thermal conductivity is higher than conventional concrete; the authors say UHPC is not recommended for high-temperature use (low heat absorption capacity). Compare li-202", "Use only fine aggregate (natural sand, silica sand, recycled glass cullet, quartz sand); coarse aggregate weakens the interfacial transition zone.", "Workability is lower than normal concrete because fibres raise internal friction."], "disagree": false}, {"id": "wang-2024-multiscale-sustainable-fibre-uhpc", "title": "Wang, Chow & Lau 2024 — Multiscale perspectives for sustainable fibre-reinforced UHPC", "path": "wiki/sources/wang-2024-multiscale-sustainable-fibre-uhpc.md", "type": "source", "theme": "sustain", "year": 2024, "depth": "conclusions", "summary": "npj Materials Sustainability (DOI 10.1038/s44296-024-00021-z). Ingest depth: abstract and opening paragraph only.", "highlights": ["Replacing cement with fly ash, slag or silica fume makes early-age strength harder; the shift from coal to gas power threatens fly-ash supply, so new SCMs are needed.", "Nano-additives disperse poorly, so substitution levels stay low; the seeding mechanism is unclear (finite-element and multiscale methods suggested).", "Casting is difficult (low W/B, fibres, low workability); fibre orientation, distribution and type affect results; high homogeneity without coarse aggregate also leads to "], "disagree": false}, {"id": "wang-2026-electro-thermal-curing", "title": "Wang et al. 2026 — Electro-thermal curing for rapid early-age UHPC strength", "path": "wiki/sources/wang-2026-electro-thermal-curing.md", "type": "source", "theme": "early", "year": 2026, "depth": "ris", "summary": "Construction and Building Materials 543, 148287. DOI 10.1016/j.conbuildmat.2026.148287. Ingest depth: RIS abstract only (no PDF).", "highlights": ["3 h high-voltage activation raised 7-day compressive strength by 41%, with statistically comparable 28-day strength.", "The flexural deficit from high voltage recovered to within 2–5% of control by 28 days under moist curing; authors attribute it to reactivated secondary hydration and a de"], "disagree": false}, {"id": "wu-2026-hydration-limestone-cement-steam-curing", "title": "Wu et al. 2026 — Hydration of UHPC with limestone cement, fly ash and silica fume", "path": "wiki/sources/wu-2026-hydration-limestone-cement-steam-curing.md", "type": "source", "theme": "early", "year": 2026, "depth": "ris", "summary": "International Journal of Civil Engineering, DOI 10.1007/s40999-026-01286-2. Ingest depth: RIS abstract only.", "highlights": ["Steam curing gave 131.6 MPa at 3 days, 86.4% higher than normal curing.", "TGA, XRD, ATR-FTIR, Raman, 29Si/27Al MAS NMR and SEM-EDS show more cement hydration and pozzolanic reaction, more silicate polymerisation and Al incorporation, and a dens", "Evidence suggests a carbonate-incorporated C-S-H phase (C-S-C-H) forms under steam curing."], "disagree": false}, {"id": "yalcinkaya-2017-early-age-shrinkage-mineral-admixtures", "title": "Yalçınkaya & Yazıcı 2017 — Early-age shrinkage of UHPC with high-volume mineral admixtures", "path": "wiki/sources/yalcinkaya-2017-early-age-shrinkage-mineral-admixtures.md", "type": "source", "theme": "early", "year": 2017, "depth": "ris", "summary": "Construction and Building Materials, DOI 10.1016/j.conbuildmat.2017.03.198. Ingest depth: RIS abstract only.", "highlights": [], "disagree": false}, {"id": "yao-2026-mgo-sio2-k2hpo4-uhpc", "title": "Yao et al. 2026 — Fibre-matrix interface in MgO-SiO2-K2HPO4 UHPC", "path": "wiki/sources/yao-2026-mgo-sio2-k2hpo4-uhpc.md", "type": "source", "theme": "early", "year": 2026, "depth": "ris", "summary": "Construction and Building Materials, DOI 10.1016/j.conbuildmat.2026.145118. Ingest depth: RIS abstract only.", "highlights": ["Best mix U10-F1.2 (10 wt% UFA, 1.2 vol% steel fibre): compressive 99.3, 148.9 and 211.6 MPa at 1, 3 and 28 days.", "At 28 days, interfacial bond strength 42.46 MPa and pull-out energy 0.68 J, up 19.40% and 47.43% vs no UFA.", "Mechanism: UFA takes part in hydration (M-S-H, M-A-S-H, C(-A)-S-H), reduces mesopores and macropores, and densifies the interfacial transition zone."], "disagree": false}, {"id": "zhang-2024-low-carbon-uhpc-review", "title": "Zhang et al. 2024 — Trends toward lower-carbon UHPC", "path": "wiki/sources/zhang-2024-low-carbon-uhpc-review.md", "type": "source", "theme": "sustain", "year": 2024, "depth": "conclusions", "summary": "Construction and Building Materials 420, 135602 (Hunan University). Ingest depth: abstract only.", "highlights": ["Strength floor of 120 MPa is built into the CO2 index (CI), so carbon cuts must not sacrifice strength.", "Geopolymer binder replacement is the most effective route: embodied carbon reduction up to 62.57%, lowest CI 2.66 kg/(MPa·m³).", "Gaps: need classified, high-quality waste materials; LCAs so far ignore durability, though poor durability means repairs and more emissions; carbon plus compressive stren", "Ultra-high-performance geopolymer concrete (UHPGC) has the lowest EC and EE and the highest CI, with no strength loss."], "disagree": false}, {"id": "zhou-2021-uhpc-mixture-design-methods-review", "title": "Zhou et al. 2021 — Mixture design methods for UHPC", "path": "wiki/sources/zhou-2021-uhpc-mixture-design-methods-review.md", "type": "source", "theme": "materials", "year": 2021, "depth": "conclusions", "summary": "Cement and Concrete Composites 124, 104242 (Hunan University, UBC). Ingest depth: abstract and introduction only.", "highlights": ["Close packing is by far the most widely used. Weakness: most models consider only the dry solid skeleton, ignoring water and superplasticizer, so measured packing density", "Rheology-based design gives satisfactory flow and even fibre/aggregate dispersion; water and superplasticizer demand should consider particle packing and paste flow, but ", "Statistical design quantifies mix-proportion/performance relationships and simplifies the experimental work.", "ANN is simpler and more direct than traditional statistics for cost-effective prediction, but can overfit locally and lacks data to train each neuron."], "disagree": true}], "links": [{"source": "abbas-2016-uhpc-performance-challenges", "target": "uhpc-design-and-standards"}, {"source": "abbas-2016-uhpc-performance-challenges", "target": "uhpc-durability"}, {"source": "abbas-2016-uhpc-performance-challenges", "target": "uhpc-fibres-and-tensile-behaviour"}, {"source": "abbas-2016-uhpc-performance-challenges", "target": "uhpc-mix-design"}, {"source": "abbas-2016-uhpc-performance-challenges", "target": "uhpc-sustainability"}, {"source": "alahmari-2025-non-proprietary-uhpfrc-ml", "target": "uhpc-early-age-and-curing"}, {"source": "alahmari-2025-non-proprietary-uhpfrc-ml", "target": "uhpc-mix-design"}, {"source": "alahmari-2025-non-proprietary-uhpfrc-ml", "target": "uhpc-sustainability"}, {"source": "baqersad-2017-uhpc-mechanical-properties", "target": "uhpc-design-and-standards"}, {"source": "du-2024-steel-fibre-tensile-review", "target": "uhpc-design-and-standards"}, {"source": "du-2024-steel-fibre-tensile-review", "target": "uhpc-fibres-and-tensile-behaviour"}, {"source": "du-2024-steel-fibre-tensile-review", "target": "uhpc-mix-design"}, {"source": "el-abbasy-2022-uhpfc-production-review", "target": "uhpc-early-age-and-curing"}, {"source": "el-abbasy-2022-uhpfc-production-review", "target": "uhpc-fibres-and-tensile-behaviour"}, {"source": "el-abbasy-2022-uhpfc-production-review", "target": "uhpc-mix-design"}, {"source": "el-abbasy-2023-uhpfrc-tensile-flexural-review", "target": "uhpc-fibres-and-tensile-behaviour"}, {"source": "he-2026-bridge-rehabilitation-review", "target": "sun-2026-early-age-uhpc-elevated-temperature"}, {"source": "he-2026-bridge-rehabilitation-review", "target": "uhpc-bridge-applications"}, {"source": "he-2026-bridge-rehabilitation-review", "target": "uhpc-design-and-standards"}, {"source": "he-2026-bridge-rehabilitation-review", "target": "uhpc-durability"}, {"source cv.addEventListener("pointerdown", e => { cv.setPointerCapture(e.pointerId); moved = false; const [x,y] = loc(e), n = nodeAt(x,y); if (n) { drag = n; n.fixed = true; } else pan = {x:x-cam.x, y:y-cam.y}; cv.classList.add("grabbing"); });
cv.addEventListener("pointermove", e => { const [x,y] = loc(e);
  if (drag) { [drag.x, drag.y] = screenToWorld(x,y); moved = true; alpha = Math.max(alpha,.25); }
  else if (pan) { cam.x = tgt.x = x-pan.x; cam.y = tgt.y = y-pan.y; moved = true; }
  else { hover = nodeAt(x,y); cv.classList.toggle("pointer", !!hover); } });
cv.addEventListener("pointerup", () => { cv.classList.remove("grabbing"); if (drag) { drag.fixed = false; if (!moved) select(drag); drag = null; } else if (pan && !moved) select(null); pan = null; });
cv.addEventListener("wheel", e => { e.preventDefault(); const [x,y] = loc(e), k = Math.min(4, Math.max(.2, tgt.k*(e.deltaY<0 ? 1.15 : .87))); tgt.x = x-(x-tgt.x)*k/tgt.k; tgt.y = y-(y-tgt.y)*k/tgt.k; tgt.k = k; }, {passive:false});

const panel = $("panel");
function select(n) {
  selected = n; $("hint").style.opacity = 0;
  if (!n) { panel.style.display = "none"; return; }
  const col = typeCol(n.type), nbs = nb.get(n).filter(m => passes(m));
  const sorted = [...nbs].sort((a,b) => (a.type==="source")-(b.type==="source") || (b.year||0)-(a.year||0));
  const label = n.type==="source" ? "Concepts this paper feeds" : n.type==="synthesis" ? "Built from" : "Supporting papers and related pages";
  panel.innerHTML = `<button id="close" aria-label="Close panel">✕</button><h2>${esc(n.title)}</h2>
   <div class="chips"><span class="tag" style="color:${col}">${typeName(n.type)}${n.year?" · "+n.year:""}</span><span class="tag" style="color:${THEME_COL[n.theme]||"#94a3b8"}">${esc(DATA.themes[n.theme]||"Other")}</span>${n.depth ? `<span class="tag plain">${esc(DATA.depthLabels[n.depth])}</span>` : ""}</div>
   <p>${esc(n.summary)}</p>${n.disagree ? `<div class="warn"><b>≠ Sources disagree or conflict</b> on part of this. Read the page before citing a single value.</div>` : ""}
   ${n.highlights.length ? `<h3>Key points</h3><ul>${n.highlights.map(h => `<li>${esc(h)}</li>`).join("")}</ul>` : ""}
   <h3>${label} (${sorted.length})</h3><ul class="trail">${sorted.map(m => `<li><button data-id="${esc(m.id)}"><span class="dot" style="background:${typeCol(m.type)}"></span>${esc(m.label)}<small>${m.depth ? esc(m.depth) : typeName(m.type).toLowerCase()}</small></button></li>`).join("")}</ul>
   <h3>File</h3><code>${esc(n.path)}</code>`;
  panel.style.display = "block"; panel.scrollTop = 0; $("close").onclick = () => select(null);
  panel.querySelectorAll("[data-id]").forEach(b => b.onclick = () => select(byId[b.dataset.id]));
}
/* timeline & key */
const slider = $("slider"), playBtn = $("play"); slider.min = YMIN; slider.max = YMAX; slider.value = YMAX; $("year").textContent = YMAX;
function setYear(y) { T = y; slider.value = y; $("year").textContent = y; if (selected && visibleTarget(selected) === 0) select(null); }
slider.oninput = () => { playing = false; playBtn.textContent = "▶ Play"; setYear(+slider.value); fitBox(visibleNodes()); };
let playTimer = null;
playBtn.onclick = () => { if (playing) { playing = false; clearInterval(playTimer); playBtn.textContent = "▶ Play"; return; }
  playing = true; playBtn.textContent = "❚❚ Pause"; select(null); if (T >= YMAX) setYear(YMIN);
  playTimer = setInterval(() => { if (T >= YMAX) { playing = false; clearInterval(playTimer); playBtn.textContent = "▶ Play"; fitBox(visibleNodes()); return; } setYear(T+1); fitBox(visibleNodes()); }, 750); };
const ring = (d,w) => `<svg width="22" height="22"><circle cx="11" cy="11" r="6" fill="#1f4e79"/><circle cx="11" cy="11" r="9" fill="none" stroke="#fff" stroke-width="${w}" stroke-dasharray="${d}"/></svg>`;
$("key").innerHTML = `<div><svg width="22" height="22"><circle cx="11" cy="11" r="5" fill="#8c95a3"/></svg> Paper</div><div><svg width="22" height="22"><circle cx="11" cy="11" r="8" fill="#1f4e79"/></svg> Concept (larger = more papers)</div><div><svg width="22" height="22"><line x1="2" y1="11" x2="20" y2="11" stroke="#1f4e79" stroke-width="2"/></svg> Links of the page you point at</div>`;
$("keybtn").onclick = () => { $("key").style.display = $("key").style.display === "block" ? "none" : "block"; };
addEventListener("keydown", e => { if (e.key === "/" && document.activeElement !== $("q")) { e.preventDefault(); $("q").focus(); } if (e.key === "Escape") { $("q").blur(); select(null); } });
addEventListener("resize", resize);
renderCatalog(); renderConcepts(); resize(); Object.assign(cam, tgt); requestAnimationFrame(frame);
setTimeout(() => { $("hint").style.opacity = 0; }, 9000);
</script>
</body>
